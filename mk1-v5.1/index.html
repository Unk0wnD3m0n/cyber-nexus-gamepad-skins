<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#06121e"><title>CYBER NEXUS — MK1 Sub-Zero V5.1</title><link rel="stylesheet" href="style.css?v=mk1-v5-1-inline-logo-3"></head>
<body><main class="stage" aria-label="CYBER NEXUS MK1 Sub-Zero DualShock theme">
<div class="controller-art">

  <div class="part trigger lt" data-button="6"></div><div class="part trigger rt" data-button="7"></div>
  <div class="part bumper lb" data-button="4"></div><div class="part bumper rb" data-button="5"></div>
  <div class="part menu create" data-button="8"></div><div class="part menu options" data-button="9"></div>
  <div class="part direction up" data-button="12"></div><div class="part direction down" data-button="13"></div><div class="part direction left" data-button="14"></div><div class="part direction right" data-button="15"></div>

  <div class="part stick ls" data-stick="left" data-button="10"></div><div class="part stick rs" data-stick="right" data-button="11"></div>
  <div class="part pad" data-button="17"></div><div class="part ps" data-button="16"></div>
</div><svg class="brand" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CYBER NEXUS — MORTAL KOMBAT 1" viewBox="0 0 640 280" style="position:absolute;left:50%;top:35%;width:255px;height:112px;transform:translate(-50%,-50%);pointer-events:none;z-index:5;filter:drop-shadow(0 1px 3px #000)">
<defs>
  <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#edffff"/><stop offset=".45" stop-color="#83dcff"/><stop offset="1" stop-color="#2687e9"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#d9ffff"/><stop offset="1" stop-color="#83cafa"/>
  </linearGradient>
</defs>
<!-- CYBER NEXUS is the complete channel name, now stacked for maximum readability. -->
<text x="320" y="90" font-family="Arial,Helvetica,sans-serif" font-size="75" font-weight="900"
      text-anchor="middle" letter-spacing="19" stroke="#04172a" stroke-width="12" stroke-linejoin="round"
      paint-order="stroke" fill="url(#ice)">CYBER</text>
<text x="320" y="188" font-family="Arial,Helvetica,sans-serif" font-size="111" font-weight="900"
      text-anchor="middle" letter-spacing="15" stroke="#031529" stroke-width="13" stroke-linejoin="round"
      paint-order="stroke" fill="url(#ice)">NEXUS</text>
<path d="M91 205 H549" stroke="#79e6ff" stroke-width="3" opacity=".85"/>
<text x="320" y="255" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="800"
      text-anchor="middle" letter-spacing="10" stroke="#061d32" stroke-width="4"
      paint-order="stroke" fill="url(#shine)">MORTAL KOMBAT 1</text>
</svg><img class="frost" src="assets/ice-overlay.svg?v=mk1-v5-ice-detail-4" alt="" aria-hidden="true">
<div class="status">PRESS A BUTTON TO CONNECT</div><div class="debug" aria-live="off"></div></main>
